name: Build Tela Compartilhada (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compilar captura de audio
        run: cl /nologo /EHsc /O2 /std:c++17 /DUNICODE /D_UNICODE native\audio-app.cpp /Fe:native\audio-app.exe
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
      - name: Zipar
        run: Compress-Archive -Path dist\*.exe -DestinationPath TelaCompartilhada.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TelaCompartilhada-windows
          path: TelaCompartilhada.zip
